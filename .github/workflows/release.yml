name: Publish Release

# 各 private リポジトリの build.yml から cross-repo dispatch で呼び出される。
# 手動トリガーも可（緊急再実行用）。
#
# app input の値でどちらのアプリかを判定する:
#   "twitchbot" → LikeHorimiya/TwitchAutoShoutOutBot  (従来の TwitchBot 処理)
#   "ytw"       → crest-streamer/YTW_Chat_TransViewer (YTW Chat TransViewer 処理)
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Target app: "twitchbot" or "ytw"'
        required: true
        default: 'twitchbot'
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
      run_id:
        description: 'GitHub Actions run_id of the private build job'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'false'
      llama_tag:
        description: '[twitchbot] llama.cpp tag (informational)'
        required: false
        default: ''
      src_sha:
        description: 'Source commit SHA (informational)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # ═══════════════════════════════════════════════════════════════════════
      #  ── TWITCHBOT ルート ─────────────────────────────────────────────────
      # ═══════════════════════════════════════════════════════════════════════

      # ── T-1. artifact ダウンロード（TwitchBot） ───────────────────────
      - name: '[twitchbot] Download artifact from private repo'
        if: inputs.app == 'twitchbot'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          PRIVATE_REPO: LikeHorimiya/TwitchAutoShoutOutBot
          RUN_ID: ${{ inputs.run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          echo "PRIVATE_REPO: ${PRIVATE_REPO}"
          echo "RUN_ID: ${RUN_ID}"
          echo "VERSION: ${VERSION}"
          API_URL="https://api.github.com/repos/${PRIVATE_REPO}/actions/runs/${RUN_ID}/artifacts"
          echo "API_URL: ${API_URL}"

          ARTIFACTS=$(curl -fsSL \
            -H "Authorization: Bearer ${RELEASE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}")

          echo "Artifact list:"
          echo "${ARTIFACTS}" | jq -r '.artifacts[] | "\(.id)  \(.name)"'

          ARTIFACT_ID=$(echo "${ARTIFACTS}" | jq -r \
            '.artifacts[] | select(.name | test("TwitchBot-.*-installer")) | .id' \
            | head -1)

          if [ -z "${ARTIFACT_ID}" ]; then
            echo "ERROR: No installer artifact found in run ${RUN_ID}"
            exit 1
          fi
          echo "Artifact ID: ${ARTIFACT_ID}"

          curl -fsSL \
            -H "Authorization: Bearer ${RELEASE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact_wrapper.zip

          echo "Downloaded artifact_wrapper.zip: $(du -h artifact_wrapper.zip | cut -f1)"

      # ── T-2. EXE 取り出し（TwitchBot） ───────────────────────────────
      - name: '[twitchbot] Extract installer'
        if: inputs.app == 'twitchbot'
        run: |
          set -euo pipefail
          unzip -o artifact_wrapper.zip
          echo "=== Extracted files ==="
          ls -lh TwitchBot-*.exe

          SETUP_EXE=$(ls TwitchBot-*.exe | head -1)
          echo "SETUP_EXE=${SETUP_EXE}" >> "$GITHUB_ENV"
          echo "Installer: ${SETUP_EXE}"

      # ── T-3. SHA-256（TwitchBot） ─────────────────────────────────────
      - name: '[twitchbot] Generate SHA-256'
        if: inputs.app == 'twitchbot'
        run: |
          set -euo pipefail
          SHA256=$(sha256sum "${SETUP_EXE}" | awk '{print $1}')
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"
          echo "SHA-256: ${SHA256}  ${SETUP_EXE}"

      # ── T-4. リリース ID 取得（TwitchBot） ───────────────────────────
      - name: '[twitchbot] Get release ID'
        if: inputs.app == 'twitchbot'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v0.0.1")

          RELEASE_ID=$(echo "${RELEASE}" | jq -r '.id')

          if [ -z "${RELEASE_ID}" ] || [ "${RELEASE_ID}" = "null" ]; then
            echo "ERROR: Release v0.0.1 not found in ${{ github.repository }}"
            exit 1
          fi

          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"
          echo "Found release ID: ${RELEASE_ID} (v0.0.1)"

      # ── T-5. 既存アセット削除（TwitchBot） ───────────────────────────
      - name: '[twitchbot] Delete existing TwitchBot assets'
        if: inputs.app == 'twitchbot'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Fetching asset list for release ${RELEASE_ID} ..."
          ASSETS=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets")

          echo "Current assets:"
          echo "${ASSETS}" | jq -r '.[] | "\(.id)  \(.name)"'

          ASSET_IDS=$(echo "${ASSETS}" | jq -r \
            '.[] | select(.name | test("TwitchBot-.*\\.exe")) | .id')

          if [ -z "${ASSET_IDS}" ]; then
            echo "No existing TwitchBot assets found, skipping deletion."
          else
            for AID in ${ASSET_IDS}; do
              echo "Deleting asset ID: ${AID}"
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/${AID}"
              echo "Deleted asset ID: ${AID}"
            done
          fi

      # ── T-6. アップロード（TwitchBot） ───────────────────────────────
      - name: '[twitchbot] Upload installer to existing release'
        if: inputs.app == 'twitchbot'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Uploading ${SETUP_EXE} to release ${RELEASE_ID} ..."
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            -H "Accept: application/vnd.github+json" \
            --data-binary "@${SETUP_EXE}" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${SETUP_EXE}"

          echo "Upload complete: ${SETUP_EXE}"
          echo "SHA-256: ${SHA256}  ${SETUP_EXE}"
          echo ""
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}"

      # ═══════════════════════════════════════════════════════════════════════
      #  ── YTW CHAT TRANSVIEWER ルート ──────────────────────────────────────
      # ═══════════════════════════════════════════════════════════════════════

      # ── Y-1. artifact ダウンロード（YTW） ────────────────────────────
      - name: '[ytw] Download artifact from private repo'
        if: inputs.app == 'ytw'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          PRIVATE_REPO: crest-streamer/YTW_Chat_TransViewer
          RUN_ID: ${{ inputs.run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          echo "PRIVATE_REPO: ${PRIVATE_REPO}"
          echo "RUN_ID: ${RUN_ID}"
          echo "VERSION: ${VERSION}"
          API_URL="https://api.github.com/repos/${PRIVATE_REPO}/actions/runs/${RUN_ID}/artifacts"
          echo "API_URL: ${API_URL}"

          ARTIFACTS=$(curl -fsSL \
            -H "Authorization: Bearer ${RELEASE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}")

          echo "Artifact list:"
          echo "${ARTIFACTS}" | jq -r '.artifacts[] | "\(.id)  \(.name)"'

          ARTIFACT_ID=$(echo "${ARTIFACTS}" | jq -r \
            '.artifacts[] | select(.name | test("YTW-installer-")) | .id' \
            | head -1)

          if [ -z "${ARTIFACT_ID}" ]; then
            echo "ERROR: No YTW-installer artifact found in run ${RUN_ID}"
            exit 1
          fi
          echo "Artifact ID: ${ARTIFACT_ID}"

          curl -fsSL \
            -H "Authorization: Bearer ${RELEASE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact_wrapper.zip

          echo "Downloaded artifact_wrapper.zip: $(du -h artifact_wrapper.zip | cut -f1)"

      # ── Y-2. EXE / checksums.txt 取り出し（YTW） ────────────────────
      - name: '[ytw] Extract installer'
        if: inputs.app == 'ytw'
        run: |
          set -euo pipefail
          unzip -o artifact_wrapper.zip
          echo "=== Extracted files ==="
          ls -lh

          SETUP_EXE=$(ls YTW_Chat_TransViewer-*.exe | head -1)
          echo "SETUP_EXE=${SETUP_EXE}" >> "$GITHUB_ENV"
          echo "Installer: ${SETUP_EXE}"

      # ── Y-3. SHA-256（YTW） ───────────────────────────────────────────
      - name: '[ytw] Generate SHA-256'
        if: inputs.app == 'ytw'
        run: |
          set -euo pipefail
          SHA256=$(sha256sum "${SETUP_EXE}" | awk '{print $1}')
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"
          echo "SHA-256: ${SHA256}  ${SETUP_EXE}"

      # ── Y-4. リリース ID 取得（YTW） ─────────────────────────────────
      - name: '[ytw] Get release ID'
        if: inputs.app == 'ytw'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v0.0.1")

          RELEASE_ID=$(echo "${RELEASE}" | jq -r '.id')

          if [ -z "${RELEASE_ID}" ] || [ "${RELEASE_ID}" = "null" ]; then
            echo "ERROR: Release v0.0.1 not found in ${{ github.repository }}"
            exit 1
          fi

          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"
          echo "Found release ID: ${RELEASE_ID} (v0.0.1)"

      # ── Y-5. 既存アセット削除（YTW） ─────────────────────────────────
      - name: '[ytw] Delete existing YTW_Chat_TransViewer assets'
        if: inputs.app == 'ytw'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Fetching asset list for release ${RELEASE_ID} ..."
          ASSETS=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets")

          echo "Current assets:"
          echo "${ASSETS}" | jq -r '.[] | "\(.id)  \(.name)"'

          # YTW インストーラ EXE と checksums.txt をすべて削除
          ASSET_IDS=$(echo "${ASSETS}" | jq -r \
            '.[] | select(.name | test("YTW_Chat_TransViewer-.*\\.exe|^YTW_checksums.*\\.txt$")) | .id')

          if [ -z "${ASSET_IDS}" ]; then
            echo "No existing YTW_Chat_TransViewer assets found, skipping deletion."
          else
            for AID in ${ASSET_IDS}; do
              echo "Deleting asset ID: ${AID}"
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/${AID}"
              echo "Deleted asset ID: ${AID}"
            done
          fi

      # ── Y-6. アップロード（YTW） ──────────────────────────────────────
      #   インストーラ EXE と checksums.txt の両方をアップロードする。
      - name: '[ytw] Upload installer and checksums to release v0.0.1'
        if: inputs.app == 'ytw'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          upload() {
            local file="$1"
            local name="$2"
            local ctype="$3"
            echo "Uploading ${name} ..."
            curl -fsSL \
              -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: ${ctype}" \
              -H "Accept: application/vnd.github+json" \
              --data-binary "@${file}" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}"
            echo "Uploaded: ${name}"
          }

          upload "${SETUP_EXE}"    "${SETUP_EXE}"                                       "application/octet-stream"
          upload "checksums.txt"   "YTW_checksums-${{ inputs.version }}.txt"            "text/plain"

          echo ""
          echo "SHA-256: ${SHA256}  ${SETUP_EXE}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v0.0.1"
